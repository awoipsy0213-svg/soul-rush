name: Game engine tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sync-balance.cjs --check
      - run: node scripts/check-classic.cjs
      - run: node --test tests/*.test.cjs
      - name: Browser UI smoke test
        run: node tests/browser-smoke.cjs
        env:
          SCREENSHOT_DIR: ui-screenshots
      - name: Classic browser UI smoke test
        run: node tests/classic-browser-smoke.cjs
        env:
          SCREENSHOT_DIR: classic-ui-screenshots
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: soul-rush-v018-ui-screenshots
          path: |
            ui-screenshots/
            classic-ui-screenshots/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: soul-rush-v018-playable
          path: |
            index.html
            manifest.webmanifest
            sw.js
            icons/
            assets/
            README.md
            data/
            scripts/
            docs/
            classic/
